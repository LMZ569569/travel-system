                            esc(sel.scheduleNo) + ' ' + sel.departTime + '→' + sel.arriveTime;
                    }
                    html += '<div class="confirm-item">' +
                        '<span><span class="label">' + label + '：</span> ' + transportDesc + '</span>' +
                        '<span class="price">¥' + (sel.price || 0) + '</span>' +
                        '</div>';
                } else {
                    html += '<div class="confirm-item">' +
                        '<span><span class="label">' + label + '：</span> ' + esc(p.from) + ' → ' + esc(p.to) + '</span>' +
                        '<span class="value" style="color:#dc2626;">未选择</span>' +
                        '</div>';
                }
            }
            html += '</div>';

            // 酒店信息
            var totalHotel = 0;
            html += '<div class="confirm-section">';
            html += '<div class="confirm-section-title"><span class="icon">&#127968;</span> 住宿安排</div>';
            for (var i = 0; i < destCities.length; i++) {
                var sel = wizardData.hotelSelections[i];
                if (sel && sel.noHotel) {
                    html += '<div class="confirm-item">' +
                        '<span><span class="label">' + esc(destCities[i]) + '：</span> 不安排住宿</span>' +
                        '<span class="value">-</span>' +
                        '</div>';
                } else if (sel && sel.hotelId) {
                    totalHotel += sel.hotelPrice || 0;
                    html += '<div class="confirm-item">' +
                        '<span><span class="label">' + esc(destCities[i]) + '：</span> ' + esc(sel.hotelName) + '</span>' +
                        '<span class="price">¥' + (sel.hotelPrice || 0) + '</span>' +
                        '</div>';
                } else {
                    html += '<div class="confirm-item">' +
                        '<span><span class="label">' + esc(destCities[i]) + '：</span> 未选择</span>' +
                        '<span class="value" style="color:#dc2626;">未选择</span>' +
                        '</div>';
                }
            }
            html += '</div>';

            // 总价
            var grandTotal = totalTransport + totalHotel;
            html += '<div class="confirm-total">' +
                '<span>行程总费用</span>' +
                '<span class="total-price">¥' + grandTotal + '</span>' +
                '</div>';

            // 附加说明
            html += '<div class="hint" style="margin-top:16px;margin-bottom:0;">' +
                '交通费合计：¥' + totalTransport + ' | 住宿费合计：¥' + totalHotel +
                ' | 最终行程可能包含更多细节安排（景点、用餐等），费用将在生成后展示。' +
                '</div>';

            container.innerHTML = html;
        }

        // ===== 生成行程 =====
        document.getElementById('btn-generate').addEventListener('click', function () {
            if (!localStorage.getItem('token')) {
                if (confirm('请先登录才能生成行程，是否前往登录？')) {
                    window.location.href = 'login.html';
                }
                return;
            }

            // 检查是否有未选择的交通段
            var pairs = getCityPairs();
            var hasUnselected = false;
            for (var i = 0; i < pairs.length; i++) {
                if (!wizardData.transportSelections[i] || !wizardData.transportSelections[i].selected) {
                    hasUnselected = true;
                    break;
                }
            }
            if (hasUnselected) {
                if (!confirm('有交通段未选择，将不包含交通信息。是否继续？')) {
                    return;
                }
            }

            var btn = this;
            btn.disabled = true;
            btn.textContent = '生成中...';

            // 隐藏当前界面，显示加载
            document.getElementById('step-confirm').classList.remove('active');
            document.getElementById('plan-loading').style.display = 'block';

            // 构造请求体
            var destCities = [];
            var rows = document.querySelectorAll('#city-rows .city-row');
            for (var i = 0; i < rows.length; i++) {
                var prov = rows[i].querySelector('.city-province').value;
                var city = rows[i].querySelector('.city-city').value;
                var days = rows[i].querySelector('.city-days').value;
                if (!prov) continue;
                destCities.push({
                    province: prov,
                    city: city || null,
                    days: days ? parseInt(days, 10) : null,
                    hotelId: wizardData.hotelSelections[i] && !wizardData.hotelSelections[i].noHotel ? wizardData.hotelSelections[i].hotelId : null
                });
            }

            var transportSegments = [];
            for (var i = 0; i < pairs.length; i++) {
                var sel = wizardData.transportSelections[i];
                if (sel && sel.selected && !sel.isSelfDrive) {
                    if (sel.isTransfer) {
                        transportSegments.push({
                            type: 'transfer',
                            scheduleNo: sel.scheduleNo,
                            fromCity: sel.transferDetail.firstFrom,
                            toCity: sel.transferDetail.secondTo,
                            departTime: sel.departTime,
                            arriveTime: sel.arriveTime,
                            price: sel.price || 0
                        });
                    } else {
                        transportSegments.push({
                            type: sel.type,
                            scheduleNo: sel.scheduleNo,
                            fromCity: sel.from,
                            toCity: sel.to,
                            departTime: sel.departTime,
                            arriveTime: sel.arriveTime,
                            price: sel.price || 0
                        });
                    }
                }
            }

            var body = {
                originCity: wizardData.originCity || null,
                startDate: wizardData.startDate || null,
                endDate: wizardData.endDate || null,
                cities: destCities,
                transportSegments: transportSegments.length > 0 ? transportSegments : null
            };

            api('/api/plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(function (data) {
                document.getElementById('plan-loading').style.display = 'none';
                if (data.code === 200) {
                    renderResult(data.data);
                    document.getElementById('result-section').style.display = 'block';
                } else {
                    alert(data.message || '规划失败');
                    document.getElementById('step-confirm').classList.add('active');
                }
            }).catch(function (e) {
                console.error('规划失败', e);
                document.getElementById('plan-loading').style.display = 'none';
                alert('请求失败，请确认后端已启动');
                document.getElementById('step-confirm').classList.add('active');
            }).finally(function () {
                btn.disabled = false;
                btn.textContent = '生成行程';
            });
        });

        document.getElementById('confirm-prev').addEventListener('click', function () {
            goPrev();
        });

        // ===== 结果渲染 =====
        var MODE_NAME = { 'self-drive': '自驾', 'train': '火车', 'flight': '飞机', 'transfer': '中转' };
        var SLOT_TYPE = {
            'transport': { name: '交通', cls: 'slot-transport' },
            'hotel': { name: '酒店', cls: 'slot-hotel' },
            'attraction': { name: '景点', cls: 'slot-attraction' },
            'meal': { name: '用餐', cls: 'slot-meal' },
            'free': { name: '自由', cls: 'slot-free' }
        };

        function renderResult(result) {
            var container = document.getElementById('plan-result');
            container.style.display = 'block';

            var dest = result.cities && result.cities.length
                ? result.cities.map(function (c) { return c.city || c.province; }).join(' → ')
                : (result.city || result.province || '');
            var modeName = result.transportSegments && result.transportSegments.length
                ? '多段交通'
                : (MODE_NAME[result.transportMode] || '自驾');

            var html =
                '<div class="plan-summary">' +
                    '<div class="stat"><div class="num">' + esc(dest) + '</div><div class="label">规划目的地</div></div>' +
                    '<div class="stat"><div class="num">' + result.days + '</div><div class="label">行程天数</div></div>' +
                    '<div class="stat"><div class="num">' + modeName + '</div><div class="label">出行方式</div></div>' +
                    '<div class="stat"><div class="num">¥' + result.totalCost + '</div><div class="label">总花费</div></div>' +
                    '<div class="stat"><div class="num">' + result.avgRating + '</div><div class="label">平均评分</div></div>' +
                '</div>';

            // 交通段列表
            if (result.transportSegments && result.transportSegments.length > 0) {
                html += '<div class="card" style="margin-bottom:16px;">';
                html += '<div class="card-title" style="margin-bottom:10px;">交通段列表</div>';
                for (var si = 0; si < result.transportSegments.length; si++) {
                    var seg = result.transportSegments[si];
                    var tn = seg.type === 'flight' ? '航班' : (seg.type === 'transfer' ? '中转' : '火车');
                    var badgeClass = seg.type === 'flight' ? 'badge-flight' : (seg.type === 'transfer' ? 'badge-transfer' : 'badge-train');
                    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);">' +
                        '<span style="font-size:13px;"><span class="badge ' + badgeClass + '">' + tn + '</span> ' +
                        esc(seg.scheduleNo) + '：' +
                        esc(seg.fromCity) + ' ' + esc(seg.departTime) + ' → ' + esc(seg.toCity) + ' ' + esc(seg.arriveTime) +
                        (seg.price ? ' <span style="color:#e07b39;">¥' + seg.price + '</span>' : '') + '</span>' +
                        '</div>';
                }
                html += '</div>';
            }

            // 城市行程
            var cityList = (result.cities && result.cities.length) ? result.cities : null;

            if (cityList) {
                for (var ci = 0; ci < cityList.length; ci++) {
                    var c = cityList[ci];
                    html += '<div class="city-plan">';
                    html += '<div class="city-header">' +
                        '<span class="city-name">' + esc(c.city || c.province) + '</span>' +
                        '<span class="city-meta">' + esc(c.province) + ' · 停留 ' + c.days + ' 天 · 花费 ¥' + c.cost + '</span>' +
                    '</div>';

                    if (c.hotel) {
                        html += '<div class="city-info">酒店：' + esc(c.hotel.name) +
                            (c.hotel.address ? '（' + esc(c.hotel.address) + '）' : '') + '</div>';
                    }
                    if (c.transport) {
                        var t = c.transport;
                        var tn = t.type === 'flight' ? '航班' : '火车';
                        html += '<div class="city-info">' + tn + '：' + esc(t.scheduleNo) + ' ' +
                            esc(t.fromCity) + ' ' + esc(t.departTime) + ' → ' + esc(t.toCity) + ' ' + esc(t.arriveTime) +
                            (t.price ? '（¥' + t.price + '）' : '') + '</div>';
                    }

                    for (var di = 0; di < c.dayPlans.length; di++) {
                        html += renderDay(c.dayPlans[di]);
                    }
                    html += '</div>';
                }
            } else if (result.dayPlans) {
                for (var di2 = 0; di2 < result.dayPlans.length; di2++) {
                    html += renderDay(result.dayPlans[di2]);
                }
            }

            container.innerHTML = html;
        }

        function renderDay(day) {
            var dateStr = day.date ? ' · ' + day.date : '';
            var html =
                '<div class="day-plan">' +
                    '<div class="day-header">' +
                        '<span class="day-title">第 ' + day.day + ' 天' + dateStr + '</span>' +
                        '<span class="day-meta">游玩约 ' + day.dayHours + ' 小时 · 花费 ¥' + day.dayCost + ' · 评分 ' + day.dayRating + '</span>' +
                    '</div>' +
                    '<div class="timeline">';

            for (var i = 0; i < day.slots.length; i++) {
                var ts = day.slots[i];
                var meta = SLOT_TYPE[ts.type] || { name: '其他', cls: 'slot-free' };
                var note = ts.note ? '<div class="slot-note">' + esc(ts.note) + '</div>' : '';
                var spotInfo = '';
                if (ts.spot) {
                    var s = ts.spot;
                    var price = (s.price == 0) ? '免费' : '¥' + s.price;
                    spotInfo = '<div class="slot-spot">' +
                        '<span class="level-badge">' + esc(s.level) + '</span>' +
                        '<span>评分 ' + s.rating + '</span>' +
                        '<span>' + price + '</span>' +
                        (s.openTime ? '<span>' + esc(s.openTime) + '</span>' : '') +
                    '</div>';
                }
                html +=
                    '<div class="timeline-item">' +
                        '<div class="timeline-time">' + esc(ts.startTime) + '<br><span>' + esc(ts.endTime) + '</span></div>' +
                        '<div class="timeline-dot ' + meta.cls + '"></div>' +
                        '<div class="timeline-body">' +
                            '<div class="slot-title"><span class="badge ' + meta.cls + '">' + meta.name + '</span> ' + esc(ts.title) + '</div>' +
                            spotInfo + note +
                        '</div>' +
                    '</div>';
            }

            html += '</div></div>';
            return html;
        }

        // ===== 结果页面操作 =====
        document.getElementById('btn-back-to-wizard').addEventListener('click', function () {
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('plan-result').style.display = 'none';
            currentStep = stepKeys.indexOf('confirm');
            showCurrentStep();
        });

        document.getElementById('btn-new-plan').addEventListener('click', function () {
            if (confirm('重新规划将清空当前所有选择，确认吗？')) {
                location.reload();
            }
        });

        // ===== 弹窗相关（旧版兼容，保留但不再使用） =====
        function closeTransportModal() {
            document.getElementById('transport-modal').style.display = 'none';
        }

        function closeHotelModal() {
            document.getElementById('hotel-modal').style.display = 'none';
        }

        // 中转页面切换到火车/航班时不要显示中转
        window.switchTransportTab = function (tab) {
            if (modalTarget !== null) {
                loadTransportTab(modalTarget, tab);
            }
        };

        // ===== 初始化 =====
        function init() {
            renderNav();

            // 加载城市数据
            api('/api/city/all').then(function (data) {
                if (data.code === 200) {
                    allCities = data.data;
                    initStep1();
                    // 填充返程城市省份下拉
                    var returnProvEl = document.querySelector('.return-province');
                    if (returnProvEl) populateProvince(returnProvEl);
                    // 默认给一行目的地
                    if (document.querySelectorAll('.city-row').length === 0) {
                        addCityRow();
                    }
                    updateNextButton();
                    // 构建初始步骤
                    buildSteps();
                    initTransportSteps();
                    initHotelSteps();
                }
            }).catch(function () {
                alert('加载城市数据失败，请确认后端已启动');
            });
        }

        init();
    </script>

</body></html>
