    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址，travel_plan 是数据库名
    url: jdbc:mysql://localhost:3306/travel_plan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    # 改成你自己的 MySQL 密码！
    password: 20060204

mybatis:
